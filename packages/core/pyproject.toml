[project]
name = "tsys-core"
version = "0.1.0"
description = "Cross-cutting infrastructure: logging, clock, ids, errors, retry."
requires-python = ">=3.12"
dependencies = ["tsys-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
