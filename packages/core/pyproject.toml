[project]
name = "tsys-core"
version = "0.1.0"
description = "Cross-cutting infrastructure: logging, clock, ids, errors, retry."
requires-python = ">=3.12"
# tzdata: zoneinfo has no system tz database on Windows, and many
# containers ship without one either. IST is not optional here.
dependencies = ["tsys-domain", "tzdata>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
