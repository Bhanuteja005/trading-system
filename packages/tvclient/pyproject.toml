[project]
name = "tsys-tvclient"
version = "0.1.0"
description = "Python bridge to the TradingView MCP CLI. Subprocess in, typed snapshot out."
requires-python = ">=3.12"
dependencies = ["tsys-domain", "tsys-core", "tsys-config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
