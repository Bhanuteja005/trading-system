[project]
name = "tsys-executor"
version = "0.1.0"
description = "Signal-to-order pipeline: index name in, guarded order out."
requires-python = ">=3.12"
dependencies = [
  "tsys-domain", "tsys-core", "tsys-config", "tsys-broker",
  "tsys-tvclient", "tsys-journal",
]

[project.scripts]
tsys-executor = "tsys.executor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
