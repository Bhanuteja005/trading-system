[project]
name = "tsys-broker"
version = "0.1.0"
description = "OpenAlgo broker client: typed, idempotent, kill-switch guarded."
requires-python = ">=3.12"
dependencies = ["tsys-domain", "tsys-core", "tsys-config", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
