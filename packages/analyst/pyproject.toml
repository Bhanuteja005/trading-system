[project]
name = "tsys-analyst"
version = "0.1.0"
description = "LLM analyst: live market snapshot in, an institutional-desk call out."
requires-python = ">=3.12"
dependencies = ["tsys-domain", "tsys-core", "tsys-config", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
