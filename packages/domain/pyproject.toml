[project]
name = "tsys-domain"
version = "0.1.0"
description = "Pure domain types. No I/O, no config, no network — importable anywhere."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
