[project]
name = "tsys-journal"
version = "0.1.0"
description = "Append-only decision and order journal. Every order reconstructable."
requires-python = ">=3.12"
dependencies = ["tsys-domain", "tsys-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsys"]
